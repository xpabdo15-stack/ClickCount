
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CountUp - عداد ذكي</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="counter-card">
    <div class="logo">⚡ CountUp</div>

    <p class="subtitle">كل ضغطة بتفرق</p>

    <div class="counter-box">
      <p class="label">العدد الحالي</p>
      <div id="count">0</div>
      <p class="total">TOTAL COUNT</p>
    </div>

    <div class="buttons">
      <button id="increaseBtn" class="increase-btn">
        ＋ زيادة
      </button>

      <button id="resetBtn" class="reset-btn">
        ↻ تصفير
      </button>
    </div>

    <p class="footer">Simple • Smart • Fast</p>
  </div>

  <script src="index.js"></script>
</body>
</html>
